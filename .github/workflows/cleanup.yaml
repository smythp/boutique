name: "Clean up deployment"
on:
  pull_request_target:
    # run on pull requests targeting main
    branches:
      - main
    types: closed
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'kustomize/**'
      - '.github/workflows/kustomize-build-ci.yaml'
      - 'terraform/**'
      - '.github/workflows/terraform-validate-ci.yaml'
jobs:
  cleanup-namespace:
    runs-on: ubuntu-24.04
    environment: gke-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: chainguard-actions/google-github-actions-auth@85cdf1b6443ef00c1c6eb5ae27f6cb578a293ada # v3
        with:
          workload_identity_provider: 'projects/816257685787/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-action-runner@online-boutique-ci.iam.gserviceaccount.com'
      - uses: chainguard-actions/google-github-actions-setup-gcloud@53199b694ab2e2adea63c7e22abe9b13c1357053 # v2
        with:
          install_components: 'gke-gcloud-auth-plugin'
      - name: Delete PR namespace in staging cluster
        if: ${{ always() }}
        timeout-minutes: 20
        run: |
          gcloud container clusters get-credentials $PR_CLUSTER \
              --region $REGION --project $PROJECT_ID
          NAMESPACE="pr${PR_NUMBER}"
          kubectl delete namespace $NAMESPACE --ignore-not-found
        env:
          PROJECT_ID: "online-boutique-ci"
          PR_CLUSTER: "prs-gke-cluster"
          REGION: "us-central1"
          PR_NUMBER: ${{ github.event.number }}
